<!DOCTYPE html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel=icon href="icon.png" sizes="160x160" type="image/png">
<title>slodown</title>

<form>
  <fieldset>
    <div class=input>
      <label for=url>URL</label>
      <input required type=text id=url name=url>
    </div>
    <div class=input>
      <label for=speed>Speed multiplier</label>
      <input type=number id=speed name=speed value=1.0 step=0.01>
    </div>
    <div class=input>
      <label for=filetype>File type</label>
      <select id=filetype name=filetype>
        <option>mp4</option>
        <option>mp3</option>
      </select>
    </div>
    <div class=button-group>
      <button type="submit" id="downloadBtn">Download</button>
      <button type="button" id="updateBtn">Update yt-dlp</button>
    </div>
    <div>
      <label for=progress>Progress</label>
      <progress id=progress value=0></progress>
    </div>
  </fieldset>
</form>

<div id=serveroutput><div id=serveroutputcontent></div><div id=serveroutputanchor></div></div>

<script>
const websocket = new WebSocket('/slowmedownsocket');
let websocketId = null;
websocket.addEventListener('message', event => {
  if (!websocketId) {
    console.log('assigning websocketId of ' + event.data, event);
    websocketId = event.data;
  } else {
    let text = String(event.data);
    text = text.replace('\r\n', '\n').replace('\r', '\n');
    document.getElementById('serveroutputcontent').appendChild(new Text(text));
    document.getElementById('serveroutputanchor').scrollIntoView();
  }
});

const form = document.querySelector('form');
const progress = document.querySelector('progress');
const updateBtn = document.getElementById('updateBtn');

// Helper function to extract filename from Content-Disposition header
function getFilenameFromHeader(header, fallbackExtension) {
  if (!header) return `download.${fallbackExtension}`;
  
  // Try matching UTF-8 filename pattern: filename*=UTF-8''...
  const utf8Match = header.match(/filename\*=UTF-8''([^;]+)/i);
  if (utf8Match && utf8Match[1]) {
    return decodeURIComponent(utf8Match[1]);
  }
  
  // Standard fallback: filename="..."
  const match = header.match(/filename="?([^";]+)"?/i);
  if (match && match[1]) {
    return decodeURIComponent(match[1]);
  }
  
  return `download.${fallbackExtension}`;
}

// Handler for Updating yt-dlp
updateBtn.addEventListener('click', async () => {
  const fieldset = document.querySelector('fieldset');
  fieldset.disabled = true;
  
  try {
    const options = {
      headers: {
        'x-websocket-id': websocketId
      }
    };
    await fetch('/update-ytdlp', options);
  } catch (err) {
    console.error('Update failed:', err);
  } finally {
    fieldset.disabled = false;
  }
});

// Handler for Downloading
form.addEventListener('submit', async event => {
  event.preventDefault();
  const fieldset = document.querySelector('fieldset');
  fieldset.disabled = true;

  progress.removeAttribute('value');

  const url = document.getElementById('url').value;
  const speed = document.getElementById('speed').value;
  const filetype = document.getElementById('filetype').value;
  const options = {
    headers: {
      accept: '*/*',
      'x-websocket-id': websocketId
    }
  };

  try {
    const response = await fetch(
      '/slowmedownload?' + new URLSearchParams({url, speed, filetype}).toString(), options);
    
    // Extract filename directly from Content-Disposition
    const disposition = response.headers.get('content-disposition');
    const filename = getFilenameFromHeader(disposition, filetype);

    const contentLength = response.headers.get('content-length');
    const total = parseInt(contentLength, 10);
    const values = [];
    let loaded = 0;
    progress.max = 100;
    progress.min = 0;
    progress.value = 0;

    const reader = response.body.getReader();
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      values.push(value);
      loaded += value.byteLength;
      if (total) {
        progress.value = Math.round((loaded / total) * 100);
      }
    }

    const blob = new Blob(values);
    const fileUrl = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = fileUrl;
    a.download = filename; // Dynamic filename applied here
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(fileUrl);
  } catch (err) {
    console.error('Download error:', err);
  } finally {
    fieldset.disabled = false;
  }
});
</script>

<style>
body {
  color: white;
  background-color: black;
}

#serveroutput {
  height: 300px;
  overflow-y: scroll;
  white-space: pre;
  font-family: monospace;
  border: 1px solid white;
}

#serveroutputanchor {
  height: 1px;
}

.input > label, .input > input, .input > select {
  display: block;
}
fieldset {
  border: none;
  min-inline-size: 0;
  margin: 0;
  padding: 0;
}
fieldset > * {
  margin-bottom: 0.8em;
}
form {
  margin-block-end: 0;
}
form, form button, form input, form select {
  font-size: 20px;
  font-family: sans-serif;
}
input#url {
  width: 100%;
}
.button-group {
  display: flex;
  gap: 10px;
}
</style>
